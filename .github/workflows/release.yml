name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0

      - name: Run tests
        run: python -m unittest discover -v

      - name: Test release notes
        shell: pwsh
        run: ./tests/test_release_notes.ps1

      - name: Install UPX
        run: choco install upx -y --no-progress

      - name: Stamp version
        shell: pwsh
        run: |
          $tag = "v1.$env:GITHUB_RUN_NUMBER.$([int]$env:GITHUB_RUN_ATTEMPT - 1)"
          Set-Content -Path assets/version.txt -Value $tag -Encoding utf8 -NoNewline
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Stamped $tag"

      - name: Build the single-file executable
        run: python -m PyInstaller --clean --noconfirm MapleTapperLooker.spec

      - name: Build the unpacked folder version
        env:
          MTL_ONEDIR: '1'
        run: python -m PyInstaller --clean --noconfirm --distpath dist-folder --workpath build-folder MapleTapperLooker.spec

      - name: Check both builds
        shell: pwsh
        run: |
          $single = Get-Item dist/MapleTapperLooker.exe
          if ($single.Length -eq 0) { throw 'Single-file executable is empty.' }
          $folder = Get-Item dist-folder/MapleTapperLooker/MapleTapperLooker.exe
          if ($folder.Length -eq 0) { throw 'Folder build executable is empty.' }
          $loose = (Get-ChildItem dist-folder/MapleTapperLooker -Recurse -File).Count
          if ($loose -lt 50) { throw "Folder build has only $loose files - the packages did not come out." }
          Compress-Archive -Path dist-folder/MapleTapperLooker -DestinationPath MapleTapperLooker-folder.zip -Force
          $zip = Get-Item MapleTapperLooker-folder.zip
          "single file: {0:n0} MB   folder: $loose files, zipped {1:n0} MB" -f ($single.Length / 1MB), ($zip.Length / 1MB)

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $previous = gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Could not find the previous release.' }
          $range = $env:GITHUB_SHA
          if ($previous) { $range = "$previous..$env:GITHUB_SHA" }
          $changes = git log --no-merges --format='- %s (%h)' $range
          if ($LASTEXITCODE -ne 0) { throw 'Could not read release changes.' }
          if (-not $changes) { $changes = '- Rebuild; no new changes.' }
          @("## Changes in this version", "", $changes, "",
            "## Which download", "",
            "- **MapleTapperLooker.exe** - one file, nothing to extract. Double-click and go.",
            "- **MapleTapperLooker-folder.zip** - the same app with the Python packages left unpacked. Extract the folder anywhere and run MapleTapperLooker.exe from inside it. Keep the folder together. Starts faster and some antivirus setups are happier with it.", "",
            "Both are the same build; pick whichever one behaves on your machine.", "",
            "Built from commit $env:GITHUB_SHA. Requires Tesseract OCR installed separately.") |
            Set-Content -Path release-notes.md -Encoding utf8
          gh release create $tag dist/MapleTapperLooker.exe MapleTapperLooker-folder.zip --target $env:GITHUB_SHA --title $tag --generate-notes --notes-file release-notes.md
