name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0

      - name: Run tests
        run: python -m unittest -v test_beep test_recorded_alert

      - name: Test release notes
        shell: pwsh
        run: ./test_release_notes.ps1

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm MapleTapperLooker.spec

      - name: Check executable
        shell: pwsh
        run: |
          $exe = Get-Item dist/MapleTapperLooker.exe
          if ($exe.Length -eq 0) { throw 'Executable is empty.' }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          $previous = gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Could not find the previous release.' }
          $range = $env:GITHUB_SHA
          if ($previous) { $range = "$previous..$env:GITHUB_SHA" }
          $changes = git log --no-merges --format='- %s (%h)' $range
          if ($LASTEXITCODE -ne 0) { throw 'Could not read release changes.' }
          if (-not $changes) { $changes = '- Rebuild; no new changes.' }
          @("## Changes in this version", "", $changes, "", "Built from commit $env:GITHUB_SHA. Requires Tesseract OCR installed separately.") |
            Set-Content -Path release-notes.md -Encoding utf8
          gh release create $tag dist/MapleTapperLooker.exe --target $env:GITHUB_SHA --title "MapleTapperLooker v1.$env:GITHUB_RUN_NUMBER" --generate-notes --notes-file release-notes.md
